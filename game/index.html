<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Feast or Flight — The Turkey's Great Escape</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #1a0c20;
    height: 100%;
    overflow: hidden;
    /* No white flash on tap (Android Chrome tap highlight): every tap
       on the canvas used to flash a translucent white highlight. */
    -webkit-tap-highlight-color: transparent;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: system-ui, sans-serif;
  }
  canvas {
    width: min(100vw, 177.78vh);
    height: min(100vh, 56.25vw);
    display: block;
    background: #2b1b4a;
    cursor: pointer;
    /* Kill the mobile tap highlight + long-press callout + text
       selection on the canvas; 'manipulation' also removes the
       double-tap zoom delay so taps register as jumps immediately. */
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    outline: none;
  }
</style>
</head>
<body>
<canvas id="game" width="1280" height="720"></canvas>
<script src="src/config.js"></script>
<script src="src/random.js"></script>
<script src="src/audio.js"></script>
<script src="src/turkey.js"></script>
<script src="src/farmer.js"></script>
<script src="src/obstacles.js"></script>
<script src="src/world.js"></script>
<script src="src/hud.js"></script>
<script src="src/main.js"></script>
</body>
</html>
